<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- تدرج لوني أخضر للدرع الخارجي -->
    <linearGradient id="shieldGradGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E676" />
      <stop offset="100%" stop-color="#00A859" />
    </linearGradient>
    
    <!-- تدرج لوني أخضر فاتح للعنصر الداخلي والبرق -->
    <linearGradient id="innerGradGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B9F6CA" />
      <stop offset="100%" stop-color="#69F0AE" />
    </linearGradient>
    
    <!-- تأثير الظل الخفيف للدرع -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- خلفية شفافة -->
  <rect width="512" height="512" fill="none" />

  <!-- الإطار الخارجي للدرع -->
  <path d="M256 32C256 32 112 64 64 96C64 256 128 416 256 480C384 416 448 256 448 96C400 64 256 32 256 32Z" 
        fill="url(#shieldGradGreen)" 
        filter="url(#dropShadow)" 
        stroke="#00C853" 
        stroke-width="6"/>

  <!-- طبقة تعميق داخلية للدرع لإعطاء تأثير 3D -->
  <path d="M256 64C256 64 136 92 96 116C96 248 152 380 256 438C360 380 416 248 416 116C376 92 256 64 256 64Z" 
        fill="#052E16" 
        opacity="0.25"/>

  <!-- أيقونة قفل الأمان في الأعلى -->
  <g transform="translate(224, 130)">
    <path d="M16 24V16C16 7.163 23.163 0 32 0C40.837 0 48 7.163 48 16V24" fill="none" stroke="url(#innerGradGreen)" stroke-width="6" stroke-linecap="round"/>
    <rect x="6" y="22" width="52" height="40" rx="8" fill="url(#innerGradGreen)"/>
    <path d="M32 38V48" stroke="#052E16" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- حرف E المتداخل مع سهم التوجيه والبرق -->
  <g fill="none" stroke="url(#innerGradGreen)" stroke-linecap="round" stroke-linejoin="round">
    <path d="M180 230H260M180 270H230M180 310H280L340 310L300 250L330 220L250 280" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>

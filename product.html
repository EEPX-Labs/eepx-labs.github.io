<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">Product Details | EEPX Labs</title>
    
    <!-- Dynamic OpenGraph Tags -->
    <meta property="og:title" content="EEPX Labs Digital Product">
    <meta property="og:type" content="website">

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-950 text-slate-100 antialiased selection:bg-cyan-500 selection:text-white relative min-h-screen overflow-x-hidden">

    <div class="aurora-bg-container">
        <div class="blob-purple"></div>
        <div class="blob-cyan"></div>
    </div>

    <div class="relative z-10 flex flex-col min-h-screen">
        <header class="sticky top-0 z-40 backdrop-blur-xl bg-slate-950/80 border-b border-slate-800/80">
            <div class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">
                <a href="index.html" class="flex items-center gap-3 font-extrabold text-2xl tracking-wider text-white">
                    <img src="logo_darkmode.png" alt="EEPX Labs" class="h-9 w-auto object-contain">
                    EEPX <span class="text-cyan-400">Labs</span>
                </a>
                <a href="index.html#store" class="text-slate-300 hover:text-cyan-400 font-semibold text-sm flex items-center gap-2 transition-colors">
                    <i class="fa-solid fa-arrow-left"></i> Back to Store
                </a>
            </div>
        </header>

        <main class="flex-grow py-12 px-6 max-w-5xl mx-auto w-full">
            <div id="product-details-container">
                <div class="text-center py-20 text-slate-500">
                    <i class="fa-solid fa-spinner fa-spin text-3xl mb-3"></i>
                    <p>Loading product details...</p>
                </div>
            </div>
        </main>

        <footer class="py-8 px-6 text-center border-t border-slate-900 text-slate-600 text-xs">
            &copy; 2026 EEPX Labs. All rights reserved.
        </footer>
    </div>

    <!-- نافذة تكبير الصورة المنبثقة -->
    <div id="zoom-modal" class="fixed inset-0 z-50 bg-slate-950/90 backdrop-blur-md hidden items-center justify-center p-4 cursor-zoom-out" onclick="closeZoomModal()">
        <button class="absolute top-6 right-6 text-slate-400 hover:text-white text-3xl w-12 h-12 flex items-center justify-center bg-slate-900/80 rounded-full border border-slate-800 transition-all">
            <i class="fa-solid fa-xmark"></i>
        </button>
        <img id="zoomed-img" src="" alt="Zoomed View" class="max-w-full max-h-[90vh] object-contain rounded-2xl shadow-2xl border border-slate-800" onclick="event.stopPropagation()">
    </div>

    <script src="products.js"></script>
    <script src="script.js"></script>
    <script>
        let currentImageIndex = 0;
        let activeProductImages = [];

        function changeSlide(direction) {
            if (activeProductImages.length === 0) return;
            currentImageIndex += direction;
            if (currentImageIndex < 0) {
                currentImageIndex = activeProductImages.length - 1;
            } else if (currentImageIndex >= activeProductImages.length) {
                currentImageIndex = 0;
            }
            updateSlideView();
        }

        function updateSlideView() {
            const imgElement = document.getElementById('active-product-img');
            const counterElement = document.getElementById('image-counter');
            if (imgElement) {
                imgElement.style.opacity = '0';
                setTimeout(() => {
                    imgElement.src = activeProductImages[currentImageIndex];
                    imgElement.style.opacity = '1';
                }, 150);
            }
            if (counterElement) {
                counterElement.innerText = `${currentImageIndex + 1} / ${activeProductImages.length}`;
            }
        }

        function openZoomModal() {
            if (activeProductImages.length === 0) return;
            const modal = document.getElementById('zoom-modal');
            const zoomedImg = document.getElementById('zoomed-img');
            zoomedImg.src = activeProductImages[currentImageIndex];
            modal.classList.remove('hidden');
            modal.classList.add('flex');
            document.body.style.overflow = 'hidden';
        }

        function closeZoomModal() {
            const modal = document.getElementById('zoom-modal');
            modal.classList.remove('flex');
            modal.classList.add('hidden');
            document.body.style.overflow = 'auto';
        }

        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const productId = urlParams.get('id');
            const container = document.getElementById('product-details-container');
            
            if (typeof products === 'undefined') {
                container.innerHTML = `<div class="text-center py-20 text-red-400">Error loading products data.</div>`;
                return;
            }

            const product = products.find(p => p.id === productId);

            if (!product) {
                container.innerHTML = `
                    <div class="text-center py-20">
                        <h2 class="text-2xl font-bold text-white mb-2">Product Not Found</h2>
                        <a href="index.html" class="text-cyan-400 underline">Return to Home</a>
                    </div>
                `;
                return;
            }

            document.getElementById('page-title').innerText = `${product.title} | EEPX Labs`;
            
            // اعتماد القراءة من مصفوفة images بشكل أساسي
            activeProductImages = product.images && product.images.length > 0 ? product.images : [product.image || 'logo_darkmode.png'];
            currentImageIndex = 0;

            container.innerHTML = `
                <!-- 1. Header Details -->
                <div class="bg-gradient-to-b from-slate-900/80 to-slate-900/30 border border-slate-800/80 rounded-3xl p-8 lg:p-10 mb-6 backdrop-blur-xl relative overflow-hidden shadow-2xl">
                    <div class="flex flex-wrap items-center gap-3 mb-4">
                        <span class="bg-cyan-500/10 border border-cyan-500/30 text-cyan-400 text-xs font-bold px-3 py-1 rounded-full">
                            ${product.badge}
                        </span>
                        <span class="text-xs uppercase font-extrabold tracking-widest text-slate-400">${product.subCategory}</span>
                    </div>

                    <h1 class="text-3xl lg:text-5xl font-black text-white tracking-tight leading-tight">${product.title}</h1>
                </div>

                <!-- 2. Overview -->
                <div class="bg-slate-900/50 border border-slate-800/80 rounded-2xl p-6 mb-8 backdrop-blur-md">
                    <h3 class="text-xs font-bold uppercase tracking-wider text-slate-400 mb-2">Quick Overview</h3>
                    <p class="text-slate-200 text-base lg:text-lg leading-relaxed">${product.shortDesc}</p>
                </div>

                <!-- 3. Price Card -->
                <div class="bg-slate-900/80 border border-cyan-500/30 rounded-3xl p-6 lg:p-8 mb-10 backdrop-blur-xl flex flex-col sm:flex-row items-center justify-between gap-6 shadow-xl shadow-cyan-500/5">
                    <div class="flex items-center gap-4 text-center sm:text-left">
                        <span class="text-4xl lg:text-5xl font-black text-white">${product.price}</span>
                        <div class="text-xs text-slate-400 space-y-1">
                            <p class="text-slate-200 font-semibold"><i class="fa-solid fa-shield-check text-cyan-400 mr-1"></i> Instant Delivery</p>
                            <p>Lifetime Minor Updates Included</p>
                        </div>
                    </div>
                    <a href="${product.downloadLink}" class="w-full sm:w-auto bg-cyan-500 hover:bg-cyan-400 text-white font-black py-4 px-8 rounded-2xl transition-all shadow-lg shadow-cyan-500/25 text-base flex items-center justify-center gap-2">
                        <i class="fa-solid fa-bag-shopping"></i> Get License (${product.price})
                    </a>
                </div>

                <!-- 4. Image Gallery -->
                <div class="bg-slate-950 border border-slate-800 rounded-3xl p-6 mb-10 relative shadow-inner group">
                    <div class="relative h-[380px] lg:h-[450px] flex items-center justify-center overflow-hidden rounded-2xl bg-slate-900/40">
                        <img id="active-product-img" src="${activeProductImages[0]}" alt="${product.title}" class="max-h-full max-w-full object-contain transition-opacity duration-150 drop-shadow-2xl cursor-zoom-in hover:scale-[1.01] transition-transform" onclick="openZoomModal()" title="Click to zoom image" onerror="this.src='logo_darkmode.png'">
                        
                        <div class="absolute top-4 right-4 bg-slate-900/80 border border-slate-700 text-slate-300 text-xs px-3 py-1.5 rounded-lg pointer-events-none flex items-center gap-1.5 shadow-md">
                            <i class="fa-solid fa-magnifying-glass-plus text-cyan-400"></i> Click to zoom
                        </div>

                        ${activeProductImages.length > 1 ? `
                            <button onclick="changeSlide(-1)" class="absolute left-4 bg-slate-900/80 hover:bg-cyan-500 hover:text-slate-950 text-white w-10 h-10 rounded-full flex items-center justify-center border border-slate-700 transition-all shadow-lg">
                                <i class="fa-solid fa-chevron-left"></i>
                            </button>
                            <button onclick="changeSlide(1)" class="absolute right-4 bg-slate-900/80 hover:bg-cyan-500 hover:text-slate-950 text-white w-10 h-10 rounded-full flex items-center justify-center border border-slate-700 transition-all shadow-lg">
                                <i class="fa-solid fa-chevron-right"></i>
                            </button>
                            <div class="absolute bottom-4 bg-slate-950/80 border border-slate-800 px-3 py-1 rounded-full text-xs text-slate-300 font-mono">
                                <span id="image-counter">1 / ${activeProductImages.length}</span>
                            </div>
                        ` : ''}
                    </div>
                </div>

                <!-- 5. Details & Features Grid -->
                <div class="grid grid-cols-1 lg:grid-cols-12 gap-10 items-start">
                    <div class="lg:col-span-7 space-y-8">
                        <div class="bg-slate-900/40 border border-slate-800/80 rounded-3xl p-8 backdrop-blur-md">
                            <h3 class="text-lg font-bold text-white mb-4 flex items-center gap-2">
                                <i class="fa-solid fa-circle-info text-cyan-400"></i> Full Description
                            </h3>
                            <p class="text-slate-300 text-base leading-relaxed">${product.fullDesc}</p>
                        </div>

                        ${product.customContent ? product.customContent : ''}

                        ${product.changelog ? `
                            <div class="bg-slate-900/40 border border-slate-800/80 rounded-3xl p-8 backdrop-blur-md">
                                <h3 class="text-lg font-bold text-white mb-4 flex items-center gap-2">
                                    <i class="fa-solid fa-code-commit text-cyan-400"></i> Changelog
                                </h3>
                                <ul class="space-y-2 text-xs font-mono text-slate-300">
                                    ${product.changelog.map(log => `<li class="border-b border-slate-800/60 pb-2 flex items-center gap-2"><span class="w-1.5 h-1.5 rounded-full bg-cyan-400"></span>${log}</li>`).join('')}
                                </ul>
                            </div>
                        ` : ''}
                    </div>

                    <div class="lg:col-span-5 space-y-6">
                        <div class="bg-slate-900/40 border border-slate-800/80 rounded-3xl p-8 backdrop-blur-md">
                            <h3 class="text-lg font-bold text-white mb-6 flex items-center gap-2">
                                <i class="fa-solid fa-list-check text-cyan-400"></i> What's Included
                            </h3>
                            <ul class="space-y-4">
                                ${product.features.map(f => `
                                    <li class="text-sm text-slate-200 flex items-start gap-3">
                                        <div class="w-5 h-5 rounded-full bg-cyan-500/10 border border-cyan-500/30 flex items-center justify-center text-cyan-400 text-xs mt-0.5 shrink-0">
                                            <i class="fa-solid fa-check"></i>
                                        </div>
                                        <span class="leading-relaxed">${f}</span>
                                    </li>
                                `).join('')}
                            </ul>
                        </div>
                    </div>
                </div>
            `;
        });
    </script>
</body>
</html>

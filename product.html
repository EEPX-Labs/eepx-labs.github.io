<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">Product Details | EEPX Labs</title>
    <meta name="description" content="EEPX Labs digital product details.">
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="ambient-bg" aria-hidden="true">
        <span class="ambient-orb orb-a"></span>
        <span class="ambient-orb orb-b"></span>
        <span class="ambient-orb orb-c"></span>
        <span class="grid-overlay"></span>
        <span class="noise-overlay"></span>
    </div>

    <div class="site-shell">
        <header class="site-header">
            <div class="nav-wrap">
                <a href="index.html" class="brand">
                    <span class="brand-mark"><img src="logo_darkmode.png" alt=""></span>
                    <span class="brand-word">EEPX <b>LABS</b></span>
                </a>
                <a href="index.html#store" class="metal-button small">
                    <i class="fa-solid fa-arrow-left"></i>
                    <span>Back to Catalog</span>
                </a>
            </div>
        </header>

        <main class="product-page">
            <div id="product-details-container">
                <div class="product-loading glass-panel">
                    <i class="fa-solid fa-spinner fa-spin"></i>
                    <p>Loading product details...</p>
                </div>
            </div>
        </main>

        <footer class="site-footer">
            <div class="footer-bottom">
                <span>© 2026 EEPX Labs. All rights reserved.</span>
                <span>DESIGN • DEVELOP • LAUNCH</span>
            </div>
        </footer>
    </div>

    <div class="zoom-modal" id="zoom-modal" aria-hidden="true">
        <div class="zoom-backdrop" onclick="closeZoomModal()"></div>
        <button class="zoom-close" onclick="closeZoomModal()" aria-label="Close image"><i class="fa-solid fa-xmark"></i></button>
        <img id="zoomed-img" src="" alt="Zoomed product image">
    </div>

    <script src="products.js"></script>
    <script src="script.js"></script>
    <script>
        let currentImageIndex = 0;
        let activeProductImages = [];

        function changeSlide(direction) {
            if (!activeProductImages.length) return;

            currentImageIndex += direction;

            if (currentImageIndex < 0) currentImageIndex = activeProductImages.length - 1;
            if (currentImageIndex >= activeProductImages.length) currentImageIndex = 0;

            updateSlideView();
        }

        function updateSlideView() {
            const image = document.getElementById("active-product-img");
            const counter = document.getElementById("image-counter");

            if (!image) return;

            image.style.opacity = "0";

            setTimeout(() => {
                image.src = activeProductImages[currentImageIndex];
                image.style.opacity = "1";
            }, 120);

            if (counter) {
                counter.textContent = `${currentImageIndex + 1} / ${activeProductImages.length}`;
            }

            document.querySelectorAll(".gallery-thumb").forEach((thumb, index) => {
                thumb.classList.toggle("active", index === currentImageIndex);
            });
        }

        function goToProductSlide(index) {
            if (!activeProductImages.length) return;
            currentImageIndex = index;
            updateSlideView();
        }

        function openZoomModal() {
            if (!activeProductImages.length) return;

            const modal = document.getElementById("zoom-modal");
            const image = document.getElementById("zoomed-img");

            image.src = activeProductImages[currentImageIndex];
            modal.classList.add("active");
            modal.setAttribute("aria-hidden", "false");
            document.body.classList.add("modal-open");
        }

        function closeZoomModal() {
            const modal = document.getElementById("zoom-modal");
            modal.classList.remove("active");
            modal.setAttribute("aria-hidden", "true");
            document.body.classList.remove("modal-open");
        }

        document.addEventListener("keydown", event => {
            if (event.key === "Escape") closeZoomModal();
            if (event.key === "ArrowLeft" && activeProductImages.length) changeSlide(-1);
            if (event.key === "ArrowRight" && activeProductImages.length) changeSlide(1);
        });

        document.addEventListener("DOMContentLoaded", () => {
            const params = new URLSearchParams(window.location.search);
            const productId = params.get("id");
            const container = document.getElementById("product-details-container");

            if (typeof products === "undefined") {
                container.innerHTML = `<div class="product-error glass-panel">Error loading products data.</div>`;
                return;
            }

            const product = products.find(item => item.id === productId);

            if (!product) {
                container.innerHTML = `
                    <div class="product-error glass-panel">
                        <div class="product-error-icon"><i class="fa-solid fa-box-open"></i></div>
                        <h1>Product Not Found</h1>
                        <p>The requested product could not be found in the current catalog.</p>
                        <a href="index.html#store" class="primary-button">Return to Catalog <i class="fa-solid fa-arrow-right"></i></a>
                    </div>
                `;
                return;
            }

            document.getElementById("page-title").textContent = `${product.title} | EEPX Labs`;

            activeProductImages = product.images?.length
                ? product.images
                : [product.image || "logo_darkmode.png"];

            const mainImage = activeProductImages[0];

            container.innerHTML = `
                <section class="product-hero glass-panel">
                    <div class="product-hero-copy">
                        <div class="product-meta-row">
                            <span class="modal-badge">${product.badge || "Digital Product"}</span>
                            <span class="product-category">${product.category} / ${product.subCategory}</span>
                        </div>
                        <h1>${product.title}</h1>
                        <p>${product.shortDesc || ""}</p>

                        <div class="product-purchase">
                            <div>
                                <small>PRODUCT PRICE</small>
                                <strong>${product.price || "—"}</strong>
                            </div>
                            <div class="purchase-actions">
                                ${product.demoLink ? `
                                    <a href="${product.demoLink}" target="_blank" rel="noopener" class="secondary-button">
                                        <i class="fa-solid fa-arrow-up-right-from-square"></i> Live Demo
                                    </a>
                                ` : ""}
                                <a href="${product.downloadLink || "#"}" class="primary-button">
                                    <i class="fa-solid fa-bag-shopping"></i> Get License
                                </a>
                            </div>
                        </div>
                    </div>

                    <div class="product-hero-orbit">
                        <div class="orbit-ring"></div>
                        <img src="logo_darkmode.png" alt="" class="product-watermark">
                    </div>
                </section>

                <section class="product-gallery glass-panel">
                    <div class="gallery-main">
                        <button class="gallery-nav gallery-left" onclick="changeSlide(-1)" aria-label="Previous image">
                            <i class="fa-solid fa-arrow-left"></i>
                        </button>

                        <img id="active-product-img"
                             src="${mainImage}"
                             alt="${product.title}"
                             onclick="openZoomModal()"
                             onerror="this.onerror=null;this.src='logo_darkmode.png';"
                             title="Click to zoom">

                        <button class="gallery-nav gallery-right" onclick="changeSlide(1)" aria-label="Next image">
                            <i class="fa-solid fa-arrow-right"></i>
                        </button>

                        <div class="gallery-counter" id="image-counter">1 / ${activeProductImages.length}</div>
                        <button class="zoom-hint" onclick="openZoomModal()">
                            <i class="fa-solid fa-magnifying-glass-plus"></i> Click to zoom
                        </button>
                    </div>

                    ${activeProductImages.length > 1 ? `
                        <div class="gallery-thumbs">
                            ${activeProductImages.map((image, index) => `
                                <button class="gallery-thumb ${index === 0 ? "active" : ""}" onclick="goToProductSlide(${index})">
                                    <img src="${image}" alt="Preview ${index + 1}" onerror="this.src='logo_darkmode.png'">
                                </button>
                            `).join("")}
                        </div>
                    ` : ""}
                </section>

                <section class="product-info-grid">
                    <div class="product-info-column">
                        <article class="detail-card glass-panel">
                            <span class="section-kicker">PRODUCT OVERVIEW</span>
                            <h2>Built with purpose.</h2>
                            <p>${product.fullDesc || product.shortDesc || ""}</p>
                        </article>

                        ${product.customContent ? `
                            <article class="detail-card glass-panel custom-product-content">
                                ${product.customContent}
                            </article>
                        ` : ""}

                        ${product.changelog ? `
                            <article class="detail-card glass-panel">
                                <span class="section-kicker">CHANGELOG</span>
                                <h2>Latest updates.</h2>
                                <div class="changelog-list">
                                    ${product.changelog.map(item => `
                                        <div class="changelog-item">
                                            <span></span>
                                            <p>${item}</p>
                                        </div>
                                    `).join("")}
                                </div>
                            </article>
                        ` : ""}
                    </div>

                    <aside class="detail-card glass-panel included-card">
                        <span class="section-kicker">WHAT'S INCLUDED</span>
                        <h2>Inside the package.</h2>
                        <ul class="included-list">
                            ${(product.features || []).map(feature => `
                                <li>
                                    <img src="assets/circle-check.svg" alt="">
                                    <span>${feature}</span>
                                </li>
                            `).join("")}
                        </ul>

                        ${product.technologies?.length ? `
                            <div class="tech-stack">
                                <span class="section-kicker">TECHNOLOGIES</span>
                                <div class="tech-tags">
                                    ${product.technologies.map(tech => `<span>${tech}</span>`).join("")}
                                </div>
                            </div>
                        ` : ""}
                    </aside>
                </section>
            `;

            if (activeProductImages.length <= 1) {
                document.querySelectorAll(".gallery-nav").forEach(button => button.style.display = "none");
            }
        });
    </script>

    <style>
        .product-page { width:min(1120px,calc(100% - 40px)); margin:auto; padding:65px 0 40px; }
        .product-loading,.product-error { min-height:400px; display:grid; place-items:center; align-content:center; gap:10px; border-radius:28px; text-align:center; color:#6e828d; padding:30px; }
        .product-loading i { color:var(--cyan); font-size:25px; }
        .product-error-icon { width:60px;height:60px;display:grid;place-items:center;border-radius:18px;background:var(--cyan-soft);color:var(--cyan);font-size:22px; }
        .product-error h1 { color:var(--text);font:700 32px "Space Grotesk";margin:4px 0; }
        .product-error p { margin:0 0 12px; }
        .product-hero { min-height:430px; border-radius:30px; padding:50px; display:grid; grid-template-columns:1.3fr .7fr; align-items:center; position:relative; overflow:hidden; }
        .product-hero::before { content:"";position:absolute;inset:0;background:linear-gradient(120deg,rgba(255,255,255,.07),transparent 38%,rgba(45,214,244,.05));pointer-events:none; }
        .product-hero-copy { position:relative;z-index:2; }
        .product-meta-row { display:flex;align-items:center;gap:12px;flex-wrap:wrap; }
        .product-hero h1 { font:700 clamp(36px,5vw,62px)/1.03 "Space Grotesk";letter-spacing:-.05em;max-width:750px;margin:18px 0 15px; }
        .product-hero-copy > p { color:var(--muted);font-size:14px;line-height:1.8;max-width:690px; }
        .product-purchase { margin-top:32px;padding-top:22px;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:20px; }
        .product-purchase small { display:block;color:#617581;font-size:8px;font-weight:900;letter-spacing:.16em; }
        .product-purchase strong { display:block;color:var(--cyan);font:700 34px "Space Grotesk";margin-top:2px; }
        .purchase-actions { display:flex;gap:9px;flex-wrap:wrap;justify-content:flex-end; }
        .product-hero-orbit { min-height:300px;display:grid;place-items:center;position:relative; }
        .orbit-ring { position:absolute;width:280px;height:280px;border-radius:50%;border:1px solid rgba(45,214,244,.2);box-shadow:0 0 90px rgba(45,214,244,.09); }
        .orbit-ring::before,.orbit-ring::after { content:"";position:absolute;border-radius:50%;border:1px solid rgba(255,255,255,.06); }
        .orbit-ring::before { inset:28px; } .orbit-ring::after { inset:60px; }
        .product-watermark { width:190px;height:190px;object-fit:contain;z-index:1;filter:drop-shadow(0 0 25px rgba(45,214,244,.18)); }
        .product-gallery { margin-top:20px;border-radius:28px;padding:15px; }
        .gallery-main { min-height:520px;position:relative;display:grid;place-items:center;border-radius:20px;overflow:hidden;background:radial-gradient(circle at 50% 40%,rgba(45,214,244,.08),transparent 48%),rgba(2,9,14,.55); }
        .gallery-main::after { content:"";position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,.04),transparent 25%,transparent 75%,rgba(45,214,244,.04));pointer-events:none; }
        .gallery-main > img { max-width:88%;max-height:465px;object-fit:contain;cursor:zoom-in;transition:opacity .15s ease,transform .3s ease;filter:drop-shadow(0 28px 30px rgba(0,0,0,.42));position:relative;z-index:2; }
        .gallery-main > img:hover { transform:scale(1.012); }
        .gallery-nav { position:absolute;top:50%;transform:translateY(-50%);z-index:4;width:43px;height:43px;display:grid;place-items:center;border:1px solid var(--line);border-radius:13px;color:#d5e6ec;background:rgba(3,11,17,.75);backdrop-filter:blur(12px);transition:.25s; }
        .gallery-nav:hover { color:var(--cyan);border-color:var(--line-bright); }
        .gallery-left { left:17px; } .gallery-right { right:17px; }
        .gallery-counter { position:absolute;left:50%;bottom:15px;transform:translateX(-50%);z-index:4;padding:6px 10px;border:1px solid var(--line);border-radius:9px;background:rgba(2,9,14,.75);color:#8da0aa;font:600 9px "Space Grotesk"; }
        .zoom-hint { position:absolute;top:15px;right:15px;z-index:4;padding:8px 10px;border:1px solid var(--line);border-radius:9px;background:rgba(2,9,14,.72);color:#81949e;font-size:9px; }
        .zoom-hint:hover { color:var(--cyan);border-color:var(--line-bright); }
        .gallery-thumbs { display:flex;gap:8px;overflow:auto;padding:10px 2px 2px; }
        .gallery-thumb { flex:0 0 76px;height:56px;padding:3px;border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.03);overflow:hidden;opacity:.65;transition:.25s; }
        .gallery-thumb.active,.gallery-thumb:hover { opacity:1;border-color:var(--line-bright); }
        .gallery-thumb img { width:100%;height:100%;object-fit:cover;border-radius:7px; }
        .product-info-grid { display:grid;grid-template-columns:1.25fr .75fr;gap:20px;margin-top:20px;align-items:start; }
        .product-info-column { display:grid;gap:20px; }
        .detail-card { border-radius:25px;padding:30px; }
        .detail-card h2 { margin:9px 0 12px;font:700 30px/1.1 "Space Grotesk";letter-spacing:-.04em; }
        .detail-card > p { margin:0;color:var(--muted);font-size:12px;line-height:1.9; }
        .included-card { position:sticky;top:98px; }
        .included-list { list-style:none;padding:0;margin:23px 0 0;display:grid;gap:14px; }
        .included-list li { display:flex;gap:10px;color:#c5d5dc;font-size:11px;line-height:1.65; }
        .included-list img { width:17px;height:17px;flex:0 0 auto;margin-top:1px; }
        .tech-stack { border-top:1px solid var(--line);margin-top:25px;padding-top:20px; }
        .tech-tags { display:flex;flex-wrap:wrap;gap:6px;margin-top:11px; }
        .tech-tags span { padding:7px 9px;border:1px solid var(--line);border-radius:8px;color:#8ca0aa;background:rgba(255,255,255,.035);font-size:8px;font-weight:800; }
        .changelog-list { display:grid;gap:10px;margin-top:20px; }
        .changelog-item { display:flex;gap:9px;align-items:flex-start;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.04); }
        .changelog-item span { width:6px;height:6px;border-radius:50%;background:var(--cyan);box-shadow:0 0 10px rgba(45,214,244,.4);margin-top:6px;flex:0 0 auto; }
        .changelog-item p { margin:0;color:#9eb0b9;font:500 10px/1.7 Inter; }
        .custom-product-content .code-block { overflow:auto; }
        .zoom-modal { position:fixed;inset:0;z-index:400;display:grid;place-items:center;padding:30px;opacity:0;visibility:hidden;transition:.25s; }
        .zoom-modal.active { opacity:1;visibility:visible; }
        .zoom-backdrop { position:absolute;inset:0;background:rgba(0,5,9,.9);backdrop-filter:blur(18px); }
        .zoom-modal > img { position:relative;z-index:2;max-width:94vw;max-height:88vh;object-fit:contain;border:1px solid var(--line-bright);border-radius:18px;box-shadow:0 40px 100px rgba(0,0,0,.7); }
        .zoom-close { position:absolute;right:22px;top:22px;z-index:3;width:42px;height:42px;border-radius:13px;background:rgba(255,255,255,.07);border:1px solid var(--line);color:#9cafb9; }
        .zoom-close:hover { color:var(--cyan);border-color:var(--line-bright); }
        @media(max-width:900px) {
            .product-hero { grid-template-columns:1fr;padding:35px; }
            .product-hero-orbit { min-height:220px; }
            .product-info-grid { grid-template-columns:1fr; }
            .included-card { position:static; }
        }
        @media(max-width:650px) {
            .product-page { width:min(100% - 28px,1120px);padding-top:35px; }
            .product-hero { padding:25px;border-radius:23px; }
            .product-hero h1 { font-size:39px; }
            .product-purchase { align-items:flex-start;flex-direction:column; }
            .purchase-actions { justify-content:flex-start; }
            .product-gallery { padding:9px;border-radius:22px; }
            .gallery-main { min-height:360px; }
            .gallery-main > img { max-height:320px;max-width:82%; }
            .detail-card { padding:23px;border-radius:21px; }
        }
    </style>
</body>
</html>
